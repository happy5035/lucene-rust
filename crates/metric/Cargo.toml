[package]
name = "rustlucene-metric"
version = "0.1.0"
edition = "2021"

[dependencies]
rustlucene-core = { path = "../core" }
codec-lucene9 = { path = "../codec-lucene9" }
xxhash-rust = { version = "0.8", features = ["xxh64"] }
parking_lot = "0.12"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
jni = { version = "0.21", optional = true }

[features]
default = []
jni = ["dep:jni"]

[dev-dependencies]
# 无 tempfile，用 std::env::temp_dir

[[bench]]
name = "write_throughput"
harness = false
